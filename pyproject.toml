[project]
name = "agenda-parrocchiale"
version = "0.1.0"
description = "Generatore di agende liturgiche per parrocchie e santuari"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Maurizio Chieruzzi", email = "maurizio.chieruzzi@example.com" }
]

dependencies = [
    "openpyxl>=3.1.2",
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.3",
    "WeasyPrint>=61.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# === Configurazione pytest ===
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# === Configurazione black ===
[tool.black]
line-length = 100
target-version = ["py312"]

# === Configurazione isort ===
[tool.isort]
profile = "black"
line_length = 100

# === Configurazione mypy ===
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
