# =====================================================================
# REGOLE LITURGICHE — Template generico
# =====================================================================
# NOTA: Gli ORARI e i PERIODI stagionali NON stanno qui.
#       Quelli sono dati annuali e vivono in config.xlsx.
#       Qui restano solo regole e ricorrenze che NON cambiano.
# =====================================================================

nome_parrocchia: "Nome Parrocchia"
citta: "Città"

# --- Feste civili/liturgiche a data fissa (NON annuali) ---
festivi_fissi:
  - { mese: 1,  giorno: 1,  nome: "Maria Santissima Madre di Dio" }
  - { mese: 1,  giorno: 6,  nome: "Epifania" }
  - { mese: 11, giorno: 1,  nome: "Tutti i Santi" }
  - { mese: 12, giorno: 8,  nome: "Immacolata Concezione" }
  - { mese: 12, giorno: 25, nome: "Natale" }

# --- Eccezioni alle feste fisse (opzionale) ---
# Regole speciali: salta la festa se cade di domenica, orari ridotti, ecc.
eccezioni_festivi: []
  # Esempio:
  # - { mese: 9,  giorno: 28, nome: "Beato Bernardino", salta_se_domenica: true }
  # - { mese: 12, giorno: 26, nome: "Santo Stefano", orari_ridotti: ["10:00", "18:00"] }

# --- Divieti pomeridiani (solo mattina) ---
divieti_pomeridiani:
  fissi:
    - { mese: 8,  giorno: 15, nome: "Assunta" }
    - { mese: 12, giorno: 6,  nome: "San Nicola" }
  mobili:
    - { tipo: "corpus_domini", nome: "Corpus Domini" }

# --- Ricorrenze proprie della parrocchia (NON annuali) ---
ricorrenze_proprie: []
  # Campi opzionali per ricorrenze con orari speciali:
  #   - orari_speciali_sabato: orari del sabato precedente
  #   - orari_speciali_domenica: orari della domenica
  #   - slitta_se_corpus_domini: True se la ricorrenza slitta quando
  #     coincide con la domenica del Corpus Domini
  #
  # Esempi:
  # - nome: "Triduo di San Salvatore"
  #   data: { mese: 3, giorno: 15, durata_giorni: 3 }
  #   tipo: "triduo"
  #   compilazione: "manuale"
  #   nota: "Date: 15-16-17 marzo"
  # - nome: "San Salvatore da Horta"
  #   data: { mese: 3, giorno: 18 }
  #   durata_giorni: 1
  #   nota: "Festa del santuario. Data: 18 marzo"
  # - nome: "Festa del Voto"
  #   data: { tipo: "ultima_domenica_maggio" }
  #   slitta_se_corpus_domini: true
  #   orari_speciali_sabato: ["7:00", "10:00", "17:00"]
  #   orari_speciali_domenica: ["8:30", "10:00", "11:30"]
  #   nota: "Se coincide con Corpus Domini, slitta alla prima domenica di giugno"

# --- Nove mercoledì (opzionale) ---
nove_mercoledi:
  attivo: false
  orario: "18:00"
  regola: "9 mercoledì che precedono il triduo"

# --- Celebrazioni mobili (dipendono dalla Pasqua) ---
# Ogni voce ha un "tipo" che indica al codice Python come calcolare la data.
# Tipi disponibili:
#   - pasqua                  → il giorno di Pasqua stesso
#   - pasqua_meno_N            → N giorni prima della Pasqua
#   - pasqua_piu_N             → N giorni dopo la Pasqua
#   - domeniche_quaresima      → le 5 domeniche di Quaresima (I-V)
#                                (la Domenica delle Palme è separata)
#   - domeniche_avvento        → le 4 domeniche di Avvento
#   - settimana_santa          → la Settimana Santa (da Palme a Sabato)
#   - triduo_pasquale          → Triduo Pasquale (Giovedì-Venerdì-Sabato)
celebrazioni_mobili: []
  # Ogni voce ha un "tipo" che indica al codice Python come calcolare la data.
  # Campi opzionali:
  #   - orari_speciali: lista di orari che sostituiscono quelli standard
  #   - no_messe: True se non si celebra la Messa (es. Venerdì Santo)
  #   - nota: testo informativo che appare in agenda
  # Esempi:
  # - { nome: "Mercoledì delle Ceneri", tipo: "pasqua_meno_46" }
  # - { nome: "Domenica delle Palme", tipo: "pasqua_meno_7" }
  # - { nome: "Lunedì dell'Angelo", tipo: "pasqua_piu_1", orari_speciali: ["10:00", "18:00"] }
  # - { nome: "Giovedì Santo", tipo: "pasqua_meno_3", orari_speciali: ["10:00", "18:00"] }
  # - { nome: "Venerdì Santo", tipo: "pasqua_meno_2", no_messe: true, nota: "Celebrazione Passione" }
  # - { nome: "Sabato Santo", tipo: "pasqua_meno_1", orari_speciali: ["23:00"] }
  # - { nome: "Ascensione", tipo: "pasqua_piu_39" }
  # - { nome: "Pentecoste", tipo: "pasqua_piu_49" }
  # - { nome: "Santissima Trinità", tipo: "pasqua_piu_56" }
  # - { nome: "Corpus Domini", tipo: "pasqua_piu_60" }
  # - { nome: "5 domeniche di Quaresima", tipo: "domeniche_quaresima" }
  # - { nome: "4 domeniche di Avvento", tipo: "domeniche_avvento" }
  # - { nome: "Settimana Santa", tipo: "settimana_santa" }
  # - { nome: "Triduo Pasquale", tipo: "triduo_pasquale" }

# --- Regole generali sulle celebrazioni ---
# Stabiliscono come trattare alcune categorie di feste.
regole_celebrazioni:
  # Se una solennità cade in un giorno feriale, usa gli orari della domenica
  solennita_usa_orari_festivi: true

# --- Giorni accorpati in una sola pagina ---
giorni_accorpati: []
  # Esempio:
  # - nome: "Venerdì e Sabato Santo"
  #     tipo: "settimana_santa"

# --- Matrimoni ---
matrimoni:
  attivi: true
  giorni: ["sabato"]
  mese_escluso: 5
  mostra_in_agenda: true
  posizione: "ultima_pagina"
  contenuto: ["data", "ora", "nome_sposi"]

# --- Intenzioni ---
intenzioni:
  numerazione_progressiva: false
  mostra_offerta: false
  campi_richiedente: []
  righe_per_defunto: 3
  numero_feriale_sera: 3
  numero_feriale_mattina: 1
  numero_festivo: 1
  scrittura: "manuale"

# --- Layout pagina giorno ---
layout:
  # Righe di default per ogni Messa
  righe_default: 1
  # Orari con righe extra (permettono di scrivere più intenzioni)
  # Es. "18:00": 3 → la Messa delle 18:00 ha 3 righe per le intenzioni
  righe_extra:
    "18:00": 3
    "19:00": 3
    "21:00": 3