# NOTA: Gli ORARI e i PERIODI stagionali NON stanno qui.
#       Quelli sono dati annuali e vivono in config.xlsx.
#       Qui restano solo regole e ricorrenze che NON cambiano.
# =====================================================================

nome_parrocchia: "Nome Parrocchia"
citta: "Città"

# --- Feste civili/liturgiche a data fissa (NON annuali) ---
festivi_fissi:
  - { mese: 1,  giorno: 1,  nome: "Maria Santissima Madre di Dio" }
  - { mese: 1,  giorno: 6,  nome: "Epifania" }
  - { mese: 11, giorno: 1,  nome: "Tutti i Santi" }
  - { mese: 12, giorno: 8,  nome: "Immacolata Concezione" }
  - { mese: 12, giorno: 25, nome: "Natale" }

# --- Eccezioni alle feste fisse (opzionale) ---
# Regole speciali: salta la festa se cade di domenica, orari ridotti, ecc.
eccezioni_festivi: []
  # Esempio:
  # - { mese: 9,  giorno: 28, nome: "Beato Bernardino", salta_se_domenica: true }
  # - { mese: 12, giorno: 26, nome: "Santo Stefano", orari_ridotti: ["10:00", "18:00"] }

# --- Divieti pomeridiani (solo mattina) ---
divieti_pomeridiani:
  fissi:
    - { mese: 8,  giorno: 15, nome: "Assunta" }
    - { mese: 12, giorno: 6,  nome: "San Nicola" }
  mobili:
    - { tipo: "corpus_domini", nome: "Corpus Domini" }

# --- Ricorrenze proprie della parrocchia (NON annuali) ---
ricorrenze_proprie: []
