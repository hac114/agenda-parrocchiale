  #     orario: "18:00"

# --- Nove mercoledì (opzionale) ---
nove_mercoledi:
  attivo: false
  orario: "18:00"
  regola: "9 mercoledì che precedono il triduo"

# --- Celebrazioni mobili (dipendono dalla Pasqua) ---
celebrazioni_mobili: []
  # Esempio:
  # - "Mercoledì delle Ceneri"
